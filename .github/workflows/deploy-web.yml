name: Deploy web to GitHub Pages

# Builds web/ and publishes it to the gh-pages branch of a separate deploy repo
# that serves it on GitHub Pages. Setup and the runtime config.json: ops/README.md.
# Manual only: it never runs on a push. Only the deploy job sees DEPLOY_TOKEN,
# and it runs no npm code.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build web
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/vm-tipping-2026-web/' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
        run: npm run build -w @vm-tipping-2026/shared && npm run build -w web

      # The API URL lives in config.json on gh-pages (written by ops/update-tunnel.sh).
      # Don't ship one in the bundle, and keep the existing one (keep_files), so a
      # redeploy can't point the site at a stale URL. VITE_API_BASE_URL is only the
      # fallback for when config.json is missing.
      - name: Strip runtime config.json from bundle (gh-pages owns it)
        run: rm -f ./web/dist/config.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: dist

      - name: Publish to the Pages deploy repo
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: ${{ vars.DEPLOY_REPO || 'hakon1233/vm-tipping-2026-web' }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: true
          cname: ${{ vars.PAGES_CNAME }}
