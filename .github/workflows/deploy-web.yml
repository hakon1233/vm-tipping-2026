name: Deploy web to GitHub Pages

# Builds web/ and publishes it to the gh-pages branch of a separate deploy repo
# that serves it on GitHub Pages. Setup and the runtime config.json: ops/README.md.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - "data/seed.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# The job only reads this repo; it pushes to the deploy repo with DEPLOY_TOKEN.
permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build web
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/vm-tipping-2026-web/' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
        run: npm run build -w @vm-tipping-2026/shared && npm run build -w web

      # The API URL lives in config.json on gh-pages (written by ops/update-tunnel.sh).
      # Don't ship one in the bundle, and keep the existing one (keep_files), so a
      # redeploy can't point the site at a stale URL. VITE_API_BASE_URL is only the
      # fallback for when config.json is missing.
      - name: Strip runtime config.json from bundle (gh-pages owns it)
        run: rm -f ./web/dist/config.json

      - name: Publish to the Pages deploy repo
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: ${{ vars.DEPLOY_REPO || 'hakon1233/vm-tipping-2026-web' }}
          publish_branch: gh-pages
          publish_dir: ./web/dist
          keep_files: true
          cname: ${{ vars.PAGES_CNAME }}
