name: Deploy web to GitHub Pages

# Builds the static SPA in /web and publishes it to the PUBLIC deploy repo
# (e.g. hakon1233/vm-tipping-2026-web), which serves it on GitHub Pages. This
# source repo is private, so Pages is hosted from the separate public repo.
#
# One-time setup by the founder (see README "Deploy" section):
#   Repo variables (Settings → Secrets and variables → Actions → Variables):
#     DEPLOY_REPO       owner/name of the public deploy repo  (default below)
#     VITE_BASE_PATH    Pages subpath, e.g. /vm-tipping-2026-web/  (default below)
#     VITE_API_BASE_URL the permanent API URL baked into the bundle as a fallback.
#                       The SPA overrides this at runtime from /config.json, so a
#                       tunnel restart does NOT require a rebuild — only config.json
#                       needs updating (scripts/start-tunnel.sh does this automatically).
#   Repo secrets (Settings → Secrets and variables → Actions → Secrets):
#     DEPLOY_TOKEN       a PAT (repo scope) that can push to the public deploy repo
#
# Then enable GitHub Pages on the PUBLIC repo: Settings → Pages → Deploy from
# branch → gh-pages / root.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - "data/seed.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build web
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/vm-tipping-2026-web/' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
        run: npm run build -w @vm-tipping-2026/shared && npm run build -w web

      # The live backend hostname is owned at RUNTIME by config.json on the gh-pages
      # branch (written by scripts/update-tunnel.sh). The bundle must NOT carry its own
      # config.json or it would clobber the live value on every redeploy — the exact
      # "breaks on redeploys" symptom (VMT-11). Drop it from the publish dir and tell
      # peaceiris to keep the existing gh-pages config.json. VITE_API_BASE_URL stays as
      # the in-bundle fallback the SPA uses only if config.json is ever missing.
      - name: Strip runtime config.json from bundle (gh-pages owns it)
        run: rm -f ./web/dist/config.json

      - name: Publish to public Pages repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: ${{ vars.DEPLOY_REPO || 'hakon1233/vm-tipping-2026-web' }}
          publish_branch: gh-pages
          publish_dir: ./web/dist
          keep_files: true
          cname: ${{ vars.PAGES_CNAME }}
